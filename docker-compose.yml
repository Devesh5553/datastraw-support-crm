services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datastraw_crm_app
    ports:
      - "8000:8000"
    volumes:
      - crm_data:/app/backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./support_crm.db
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173
    restart: unless-stopped

volumes:
  crm_data:
